[build-system]
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xortron-xprt3-fast"
version = "1.0.0"
description = "Integrated Penetration Testing & Security Simulation Framework"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "lionj4", email = "lionj4@github.com"}
]
keywords = ["pentesting", "security", "simulation", "exploitation", "scanning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24.3",
    "pandas>=2.1.3",
    "requests>=2.31.0",
    "scapy>=2.5.0",
    "pwntools>=4.10.1",
    "sqlalchemy>=2.0.23",
    "cryptography>=41.0.7",
    "pyyaml>=6.0.1",
    "loguru>=0.7.2",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.urls]
Homepage = "https://github.com/lionj4/XORTRON_XPRT3_FAST"
Documentation = "https://github.com/lionj4/XORTRON_XPRT3_FAST/tree/main/docs"
Repository = "https://github.com/lionj4/XORTRON_XPRT3_FAST.git"
Issues = "https://github.com/lionj4/XORTRON_XPRT3_FAST/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
    "pre-commit>=3.5.0",
]
docs = [
    "sphinx>=7.2.6",
    "sphinx-rtd-theme>=2.0.0",
]
jupyter = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.9",
    "notebook>=7.0.6",
]

[project.scripts]
xortron-scan = "xortron.cli:scan"
xortron-exploit = "xortron.cli:exploit"
xortron-report = "xortron.cli:report"

[tool.setuptools]
packages = ["xortron"]

[tool.setuptools.package-dir]
xortron = "src/xortron"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --cov=src/xortron --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/xortron"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
